name: Dev Build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: Build, test, and publish Windows package
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare pinned offline OCR models and test fixture
        shell: pwsh
        run: >-
          ./scripts/Prepare-OcrAssets.ps1
          -DestinationDirectory artifacts/ocr/tessdata
          -TestFixtureDirectory artifacts/ocr-test

      - name: Restore
        run: dotnet restore DeckContext.sln --runtime win-x64

      - name: Build
        run: dotnet build DeckContext.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DeckContext.sln --configuration Release --no-build
        env:
          DECKCONTEXT_TEST_OCR_DATA: ${{ github.workspace }}\artifacts\ocr\tessdata
          DECKCONTEXT_TEST_OCR_IMAGE: ${{ github.workspace }}\artifacts\ocr-test\phototest.tif

      # Publish the console tool first, then the WPF app into the same directory.
      # The WindowsDesktop publish supplies the superset when framework files overlap.
      - name: Publish verification command into shared package
        run: >-
          dotnet publish tools/DeckContext.Verification/DeckContext.Verification.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/publish/DeckContext

      - name: Publish Windows x64 app into shared package
        run: >-
          dotnet publish src/DeckContext.App/DeckContext.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/publish/DeckContext

      - name: Add offline OCR assets and app-local Visual C++ runtime
        shell: pwsh
        run: |
          $packageDirectory = "artifacts/publish/DeckContext"
          Copy-Item "artifacts/ocr" (Join-Path $packageDirectory "ocr") -Recurse
          Copy-Item "packaging/THIRD-PARTY-NOTICES.txt" $packageDirectory

          # windows-latest is x64, so System32 contains the x64 VC runtime that
          # loaded the native Tesseract binaries during the preceding test step.
          $crtDirectory = Join-Path $env:WINDIR "System32"

          foreach ($fileName in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            $sourcePath = Join-Path $crtDirectory $fileName
            if (-not (Test-Path $sourcePath -PathType Leaf)) {
              throw "The Visual C++ runtime file '$sourcePath' was not found."
            }

            Copy-Item $sourcePath $packageDirectory
          }

      - name: Verify shared package layout and console startup
        shell: pwsh
        run: |
          $packageDirectory = "artifacts/publish/DeckContext"
          $requiredFiles = @(
            "DeckContext.exe",
            "DeckContext.Verification.exe",
            "DeckContext.runtimeconfig.json",
            "DeckContext.Verification.runtimeconfig.json",
            "x64/tesseract55.dll",
            "x64/leptonica-1.85.0.dll",
            "ocr/tessdata/chi_sim.traineddata",
            "ocr/tessdata/eng.traineddata",
            "ocr/tessdata/spa.traineddata",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "THIRD-PARTY-NOTICES.txt"
          )

          foreach ($fileName in $requiredFiles) {
            $path = Join-Path $packageDirectory $fileName
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Merged package is missing '$fileName'."
            }
          }

          $coreClrFiles = @(Get-ChildItem artifacts/publish -Recurse -File -Filter coreclr.dll)
          if ($coreClrFiles.Count -ne 1) {
            throw "Expected one shared .NET runtime, found $($coreClrFiles.Count)."
          }

          $PSNativeCommandUseErrorActionPreference = $false
          & (Join-Path $packageDirectory "DeckContext.Verification.exe")
          $verificationExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($verificationExitCode -ne 2) {
            throw "Verification command startup check returned exit code $verificationExitCode instead of 2."
          }

          $packageBytes = (Get-ChildItem $packageDirectory -Recurse -File |
            Measure-Object -Property Length -Sum).Sum
          Write-Host "Shared package size: $packageBytes bytes"

      - name: Verify WPF main window startup
        shell: pwsh
        run: |
          $applicationPath = Resolve-Path "artifacts/publish/DeckContext/DeckContext.exe"
          $hostTracePath = Join-Path $env:RUNNER_TEMP "deckcontext-corehost-trace.log"
          $applicationLogPath = Join-Path $env:LOCALAPPDATA "DeckContext/Logs/application-errors.log"
          $env:COREHOST_TRACE = "1"
          $env:COREHOST_TRACEFILE = $hostTracePath
          $guiProcess = $null

          try {
            $guiProcess = Start-Process $applicationPath -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            $windowReady = $false
            $observedWindowTitle = ""

            while ([DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $guiProcess.Refresh()

              if ($guiProcess.HasExited) {
                throw "DeckContext exited during startup with code $($guiProcess.ExitCode)."
              }

              if ($guiProcess.MainWindowHandle -ne 0) {
                $observedWindowTitle = $guiProcess.MainWindowTitle

                if ($observedWindowTitle -eq "DeckContext") {
                  $windowReady = $true
                  break
                }
              }
            }

            if (-not $windowReady) {
              throw "DeckContext did not create its main window within 20 seconds. Observed title: '$observedWindowTitle'."
            }

            Write-Host "DeckContext main window started successfully."
          }
          catch {
            if (Test-Path $hostTracePath -PathType Leaf) {
              Write-Host "CoreHost trace:"
              Get-Content $hostTracePath
            }

            if (Test-Path $applicationLogPath -PathType Leaf) {
              Write-Host "Application error log:"
              Get-Content $applicationLogPath
            }

            throw
          }
          finally {
            if ($null -ne $guiProcess -and -not $guiProcess.HasExited) {
              Stop-Process -Id $guiProcess.Id -Force
              $guiProcess.WaitForExit()
            }

            Remove-Item Env:COREHOST_TRACE -ErrorAction SilentlyContinue
            Remove-Item Env:COREHOST_TRACEFILE -ErrorAction SilentlyContinue
          }

      - name: Resolve artifact identity
        id: artifact
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          "name=DeckContext-dev-win-x64-$shortSha" >> $env:GITHUB_OUTPUT

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifacts/publish
          if-no-files-found: error
          retention-days: 14
