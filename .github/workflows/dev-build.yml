name: Dev Build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: Build, test, and publish Windows package
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DeckContext.sln --runtime win-x64

      - name: Build
        run: dotnet build DeckContext.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DeckContext.sln --configuration Release --no-build

      # Publish the console tool first, then the WPF app into the same directory.
      # The WindowsDesktop publish supplies the superset when framework files overlap.
      - name: Publish verification command into shared package
        run: >-
          dotnet publish tools/DeckContext.Verification/DeckContext.Verification.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/publish/DeckContext

      - name: Publish Windows x64 app into shared package
        run: >-
          dotnet publish src/DeckContext.App/DeckContext.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/publish/DeckContext

      - name: Verify shared package layout and console startup
        shell: pwsh
        run: |
          $packageDirectory = "artifacts/publish/DeckContext"
          $requiredFiles = @(
            "DeckContext.exe",
            "DeckContext.Verification.exe",
            "DeckContext.runtimeconfig.json",
            "DeckContext.Verification.runtimeconfig.json"
          )

          foreach ($fileName in $requiredFiles) {
            $path = Join-Path $packageDirectory $fileName
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Merged package is missing '$fileName'."
            }
          }

          $coreClrFiles = @(Get-ChildItem artifacts/publish -Recurse -File -Filter coreclr.dll)
          if ($coreClrFiles.Count -ne 1) {
            throw "Expected one shared .NET runtime, found $($coreClrFiles.Count)."
          }

          $PSNativeCommandUseErrorActionPreference = $false
          & (Join-Path $packageDirectory "DeckContext.Verification.exe")
          $verificationExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($verificationExitCode -ne 2) {
            throw "Verification command startup check returned exit code $verificationExitCode instead of 2."
          }

          $packageBytes = (Get-ChildItem $packageDirectory -Recurse -File |
            Measure-Object -Property Length -Sum).Sum
          Write-Host "Shared package size: $packageBytes bytes"

      - name: Resolve artifact identity
        id: artifact
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          "name=DeckContext-dev-win-x64-$shortSha" >> $env:GITHUB_OUTPUT

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifacts/publish
          if-no-files-found: error
          retention-days: 14
